name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # triggers on every push to main
  workflow_dispatch:  # also allows manual trigger from GitHub UI

# Sets permissions so the workflow can write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Vite outputs to /dist by default.
        # Make sure vite.config.js has: base: '/your-repo-name/'

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist   # folder Vite builds into

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
