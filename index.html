<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5d6c0" />
<title>Worth</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

<header class="top">
  <div class="logo" aria-hidden="true">
    <!-- Inline so the stroke can be styled with currentColor if needed later -->
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M 62 14 C 82 18, 92 36, 90 55 C 87 76, 68 90, 48 88 C 26 86, 11 68, 12 47 C 14 27, 30 12, 50 12"
            fill="none" stroke="#3a2e3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </div>
  <div class="header-text">
    <h1 id="screen-title">Today's phrase</h1>
    <div class="sub" id="screen-sub">A kind word from you, to you.</div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="about-btn" data-i18n-title="about.here.title" aria-label="About">💬</button>
    <button class="lang-toggle" id="lang-toggle">IT</button>
  </div>
</header>

<div class="popover" id="about-pop" style="display:none">
  <h4 id="about-title"></h4>
  <p id="about-body"></p>
</div>

<main>

  <!-- HERE -->
  <section id="here" class="screen active">
    <div id="here-content"></div>
  </section>

  <!-- BREATHE -->
  <section id="breathe" class="screen">
    <div class="card">
      <div class="pattern-row" id="pattern-row"></div>
      <div class="pattern-desc" id="pattern-desc"></div>
      <div class="breathe-stage">
        <div class="orb" id="orb"></div>
        <div class="breathe-label" id="breathe-label">Tap to begin</div>
        <div class="actions center">
          <button class="pill primary" id="breathe-toggle">Begin</button>
        </div>
      </div>
    </div>
  </section>

  <!-- LETTERS -->
  <section id="letters" class="screen">
    <div class="card letter-form">
      <input type="text" class="letter-subject" id="letter-subject" data-i18n-placeholder="letters.subjectPlaceholder" maxlength="80" />
      <textarea class="letter-body" id="letter-body" data-i18n-placeholder="letters.bodyPlaceholder"></textarea>
      <div class="letter-cta">
        <span></span>
        <button class="pill primary" id="letter-send" data-i18n="letters.send"></button>
      </div>
    </div>
    <div class="box-button">
      <button class="pill" id="open-box-btn"></button>
    </div>
  </section>

</main>

<nav class="tabs">
  <button data-screen="here" class="active"><span class="icon">○</span><span data-i18n="tab.here"></span></button>
  <button data-screen="breathe"><span class="icon">◌</span><span data-i18n="tab.breathe"></span></button>
  <button data-screen="letters"><span class="icon">✉</span><span data-i18n="tab.letters"></span></button>
</nav>

</div><!-- /.app -->

<!-- ============== Modals ============== -->

<!-- Send modal -->
<div class="backdrop" id="send-modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 data-i18n="send.title"></h3>
    <p data-i18n="send.body"></p>
    <label class="checkbox-row">
      <input type="checkbox" id="send-change-when" />
      <span data-i18n="send.changeWhen"></span>
    </label>
    <div class="time-chips" id="send-chips">
      <button class="pill tiny active" data-opt="anytime" data-i18n="send.opt.anytime"></button>
      <button class="pill tiny" data-opt="week" data-i18n="send.opt.week"></button>
      <button class="pill tiny" data-opt="month" data-i18n="send.opt.month"></button>
      <button class="pill tiny" data-opt="three" data-i18n="send.opt.three"></button>
      <button class="pill tiny" data-opt="year" data-i18n="send.opt.year"></button>
      <button class="pill tiny" data-opt="custom" data-i18n="send.opt.custom"></button>
    </div>
    <input type="datetime-local" class="custom-time" id="send-custom-time" />
    <div class="modal-actions">
      <button class="pill ghost" id="send-cancel" data-i18n="send.cancel"></button>
      <button class="pill primary" id="send-confirm" data-i18n="send.confirm"></button>
    </div>
  </div>
</div>

<!-- Sealed-letter explainer (shown once when checkbox first ticked) -->
<div class="backdrop" id="explainer-backdrop">
  <div class="modal">
    <h3 data-i18n="explainer.title"></h3>
    <p data-i18n="explainer.body"></p>
    <div class="modal-actions">
      <button class="pill primary" id="explainer-dismiss" data-i18n="explainer.dismiss"></button>
    </div>
  </div>
</div>

<!-- Letterbox sheet -->
<div class="backdrop" id="box-backdrop">
  <div class="sheet">
    <div class="sheet-header">
      <h2 data-i18n="box.title"></h2>
      <button class="icon-btn" id="box-close" aria-label="Close">×</button>
    </div>
    <div class="sheet-body">
      <ul class="letter-list" id="box-list"></ul>
      <div class="helper-text" id="box-empty" style="text-align:center;padding:30px 10px" data-i18n="box.empty"></div>
    </div>
  </div>
</div>

<!-- Burn confirmation 1 -->
<div class="backdrop" id="burn1-backdrop">
  <div class="modal">
    <h3 data-i18n="box.burn1Title"></h3>
    <p data-i18n="box.burn1Body"></p>
    <div class="modal-actions">
      <button class="pill ghost" id="burn1-cancel" data-i18n="box.cancel"></button>
      <button class="pill danger" id="burn1-yes" data-i18n="box.burn1Yes"></button>
    </div>
  </div>
</div>

<!-- Burn confirmation 2 -->
<div class="backdrop" id="burn2-backdrop">
  <div class="modal">
    <h3 data-i18n="box.burn2Title"></h3>
    <p data-i18n="box.burn2Body"></p>
    <div class="modal-actions">
      <button class="pill ghost" id="burn2-cancel" data-i18n="box.cancel"></button>
      <button class="pill danger" id="burn2-yes" data-i18n="box.burn2Yes"></button>
    </div>
  </div>
</div>

<!-- Tutorial -->
<div class="backdrop" id="tut-backdrop">
  <div class="modal tut-card">
    <div class="step-counter" id="tut-counter"></div>
    <h3 id="tut-title"></h3>
    <p id="tut-body"></p>
    <div class="modal-actions">
      <button class="pill ghost" id="tut-skip" data-i18n="tut.skip"></button>
      <button class="pill primary" id="tut-next" data-i18n="tut.next"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
